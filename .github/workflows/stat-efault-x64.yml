name: stat EFAULT x64 reference

on:
  push:
    branches:
      - ci/stat-efault-x64

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Describe host
      run: |
        uname -a
        lscpu | head -20

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build clang lld gcc-multilib g++-multilib

    - name: Checkout Catch2
      run: git submodule update --init --depth 1 External/Catch2

    - name: Build stat_efault
      run: |
        cmake -S unittests/FEXLinuxTests/tests -B build_64 -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE=$PWD/Data/CMake/toolchain_x86_64.cmake -DENABLE_CLANG_THUNKS=True -DBITNESS=64
        ninja -C build_64 stat_efault.64
        cmake -S unittests/FEXLinuxTests/tests -B build_32 -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE=$PWD/Data/CMake/toolchain_x86_32.cmake -DENABLE_CLANG_THUNKS=True -DBITNESS=32
        ninja -C build_32 stat_efault.32

    - name: Run stat_efault natively
      run: |
        ./build_64/stat_efault.64 --success
        ./build_32/stat_efault.32 --success

    - name: Raw syscall probe
      run: |
        gcc -O0 -o probe64 stat_probe.c && ./probe64
        gcc -m32 -O0 -o probe32 stat_probe.c && ./probe32

    - name: Non-NULL bad buffer probe
      run: |
        gcc -O1 -o badbuf64 badbuf.c && gcc -m32 -O1 -o badbuf32 badbuf.c
        for B in 64 32; do for C in stat fstat; do for P in ro none; do
          echo "$B $C $P: $(./badbuf$B $C $P)"
        done; done; done

    - name: Non-readable pointer probe
      run: |
        gcc -O1 -o badptr64 badptr.c && gcc -m32 -O1 -o badptr32 badptr.c
        for B in 64 32; do for T in path buf; do for C in stat lstat statfs; do for K in none unmapped; do
          echo "$B $T $C $K: $(./badptr$B $T $C $K)"
        done; done; done; done
